<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizArena</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
/* ====== (نفس CSS ديالك بدون تغيير) ====== */
body{font-family:'Tajawal';background:#0d0f1a;color:#fff;margin:0}
.screen{display:none;padding:20px}
.screen.active{display:block}
.btn{padding:12px;width:100%;margin-top:10px}
.btn-primary{background:#7c6fe0;color:#fff;border:0}
.btn-secondary{background:#222;color:#fff;border:0}
.cat-btn.sel{border:2px solid #fff}
.answers-grid button{display:block;width:100%;margin:5px 0;padding:10px}
.correct{background:green}
.wrong{background:red}
</style>
</head>

<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <input id="home-name" placeholder="اسمك">
  <button onclick="createRoom()" class="btn btn-primary">إنشاء غرفة</button>
</div>

<!-- GAME -->
<div class="screen" id="screen-question">
  <div id="q-text"></div>
  <div id="answers-grid"></div>
  <button onclick="nextQ()" class="btn btn-primary">التالي</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ===== FIREBASE ===== */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  databaseURL: "XXXX",
  projectId: "XXXX",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== STATE ===== */
let state = {
  cat: "soccer",
  qIdx: 0,
  roomCode: "",
  isHost: true,
  currentQ: null
};

let shuffledQuestions = []; // ✅ FIX مهم

/* ===== QUESTIONS ===== */
const QUESTIONS = {
  soccer: [
    { q:"من فاز بكأس العالم 2022؟", ans:["البرازيل","الأرجنتين","فرنسا","إسبانيا"], c:1, fact:"" },
    { q:"عدد بطولات ريال مدريد؟", ans:["12","14","15","16"], c:2, fact:"" }
  ]
};

/* ===== SCREEN ===== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById("screen-"+id).classList.add('active');
}

/* ===== CREATE ROOM ===== */
window.createRoom = async function(){
  state.qIdx = 0;
  shuffledQuestions = [...QUESTIONS[state.cat]];
  shuffledQuestions.sort(()=>Math.random()-0.5);
  showQ();
}

/* ===== SHOW QUESTION ===== */
window.showQ = function(){
  const qs = shuffledQuestions;

  if(state.qIdx >= qs.length){
    alert("انتهى اللعبة");
    return;
  }

  state.currentQ = qs[state.qIdx];

  document.getElementById("q-text").innerText = state.currentQ.q;

  document.getElementById("answers-grid").innerHTML =
    state.currentQ.ans.map((a,i)=>
      `<button onclick="choose(${i})">${a}</button>`
    ).join("");

  showScreen("question");
}

/* ===== ANSWER ===== */
window.choose = function(i){
  const correct = i === state.currentQ.c;

  document.querySelectorAll("#answers-grid button").forEach((b,idx)=>{
    if(idx === state.currentQ.c) b.classList.add("correct");
    else if(idx === i) b.classList.add("wrong");
    b.disabled = true;
  });
}

/* ===== NEXT ===== */
window.nextQ = function(){
  state.qIdx++;
  showQ();
}

</script>

</body>
</html>
