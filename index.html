<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizArena</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a;
    --bg2: #141726;
    --bg3: #1c2035;
    --card: #1e2236;
    --border: rgba(255,255,255,0.07);
    --purple: #7c6fe0;
    --purple-light: #a89df0;
    --teal: #2dd4a0;
    --amber: #f5a623;
    --red: #f05252;
    --green: #4ade80;
    --text: #e8eaf6;
    --muted: #8892b0;
    --font: 'Tajawal', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; gap: 16px; animation: fadeIn .25s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

  /* ── LOGO ── */
  .logo {
    text-align: center;
    padding: 8px 0 4px;
  }
  .logo-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--text);
  }
  .logo-title span { color: var(--purple-light); }
  .logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 12px;
  }

  /* ── INPUTS ── */
  input[type="text"] {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--font);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]:focus { border-color: var(--purple); }
  input[type="text"]::placeholder { color: var(--muted); }

  /* ── BUTTONS ── */
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ── CATEGORY GRID ── */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .cat-btn {
    padding: 14px 10px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    transition: border-color .15s, transform .1s;
    line-height: 1.3;
  }
  .cat-btn:active { transform: scale(.97); }
  .cat-btn.sel { border-color: var(--purple-light); }
  .cat-soccer { background: #0a2a1a; color: #4ade80; }
  .cat-film   { background: #1a0a2a; color: #a89df0; }
  .cat-game   { background: #2a1a0a; color: #f5a623; }
  .cat-islam  { background: #0a1a2a; color: #67d4f8; }
  .cat-btn .cat-emoji { font-size: 22px; display: block; margin-bottom: 4px; }

  /* ── MODE BTNS ── */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode-btn {
    padding: 14px 10px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg3);
    cursor: pointer;
    font-family: var(--font);
    text-align: center;
    transition: border-color .15s;
  }
  .mode-btn.sel { border-color: var(--purple); background: rgba(124,111,224,.12); }
  .mode-btn .mode-label { font-size: 15px; font-weight: 700; color: var(--text); }
  .mode-btn .mode-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ── CODE DISPLAY ── */
  .code-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .code-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .code-value {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: var(--purple-light);
  }

  /* ── PLAYERS LIST ── */
  .player-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg3);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .player-av {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .av-1 { background: rgba(124,111,224,.25); color: var(--purple-light); }
  .av-2 { background: rgba(45,212,160,.2); color: var(--teal); }
  .av-3 { background: rgba(245,166,35,.2); color: var(--amber); }
  .av-4 { background: rgba(240,82,82,.2); color: var(--red); }
  .player-name { flex: 1; font-size: 14px; font-weight: 500; }
  .host-tag {
    font-size: 10px; font-weight: 700;
    background: rgba(124,111,224,.2);
    color: var(--purple-light);
    padding: 2px 8px; border-radius: 20px;
  }
  .wait-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--teal);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── COUNTDOWN ── */
  .countdown-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 40px 0;
  }
  .countdown-num {
    font-size: 96px;
    font-weight: 800;
    color: var(--purple-light);
    line-height: 1;
    animation: pop .4s ease;
  }
  @keyframes pop { from{transform:scale(1.4)} to{transform:scale(1)} }
  .countdown-label { font-size: 14px; color: var(--muted); }

  /* ── TIMER BAR ── */
  .timer-wrap {
    height: 5px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--teal);
    transition: width .1s linear, background .3s;
  }
  .timer-fill.urgent { background: var(--red); }
  .timer-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── QUESTION ── */
  .q-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    padding: 8px 4px;
    color: var(--text);
    min-height: 64px;
  }

  /* ── ANSWERS ── */
  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ans-btn {
    padding: 16px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg3);
    cursor: pointer;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
    transition: border-color .12s, background .12s, transform .1s;
  }
  .ans-btn:hover:not(:disabled) {
    border-color: var(--purple);
    background: rgba(124,111,224,.12);
  }
  .ans-btn:active:not(:disabled) { transform: scale(.97); }
  .ans-btn.correct { background: rgba(74,222,128,.15); border-color: var(--green); color: var(--green); }
  .ans-btn.wrong   { background: rgba(240,82,82,.12); border-color: var(--red); color: var(--red); }
  .ans-btn.reveal  { background: rgba(74,222,128,.1); border-color: var(--green); }

  /* ── POWER-UPS ── */
  .pu-row { display: flex; gap: 8px; justify-content: center; }
  .pu-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .pu-btn.active { background: rgba(245,166,35,.2); color: var(--amber); border-color: var(--amber); }
  .pu-btn.used { opacity: .35; text-decoration: line-through; cursor: default; }

  /* ── STREAK TOAST ── */
  .streak-toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: rgba(245,166,35,.15);
    border: 1px solid var(--amber);
    color: var(--amber);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    transition: transform .3s ease;
    z-index: 99;
    white-space: nowrap;
  }
  .streak-toast.show { transform: translateX(-50%) translateY(0); }

  /* ── LIVE SCORES ── */
  .live-scores { display: flex; flex-direction: column; gap: 6px; }
  .score-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg3);
    border-radius: 10px;
  }
  .score-name { flex: 1; font-size: 13px; font-weight: 500; }
  .score-pts {
    font-size: 15px;
    font-weight: 800;
    color: var(--purple-light);
    min-width: 60px;
    text-align: left;
  }
  .score-pts.lead { color: var(--teal); }
  .score-delta {
    font-size: 11px;
    color: var(--green);
    min-width: 36px;
    text-align: left;
  }

  /* ── PODIUM ── */
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    padding: 16px 0 8px;
  }
  .podium-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .podium-av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .podium-block {
    width: 76px;
    border-radius: 10px 10px 0 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800;
  }
  .podium-name { font-size: 12px; color: var(--muted); }
  .p1-block { background: rgba(245,166,35,.25); color: var(--amber); height: 80px; }
  .p2-block { background: rgba(124,111,224,.2); color: var(--purple-light); height: 56px; }
  .p3-block { background: rgba(143,148,166,.15); color: var(--muted); height: 40px; }

  /* ── FACT BOX ── */
  .fact-box {
    background: rgba(45,212,160,.06);
    border: 1px solid rgba(45,212,160,.2);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--teal);
    text-align: center;
  }

  /* ── RESULT BOX ── */
  .result-msg {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    padding: 4px 0;
  }
  .result-msg.ok { color: var(--green); }
  .result-msg.fail { color: var(--red); }

  /* ── ROW ── */
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── JOIN INPUT ── */
  #join-input {
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    letter-spacing: 5px;
  }
</style>
</head>
<body>

<div class="streak-toast" id="streak-toast">سلسلة ×3 — +300 نقطة!</div>

<div class="app">

  <!-- ════════ HOME ════════ -->
  <div class="screen active" id="screen-home">
    <div class="logo">
      <div class="logo-title">Quiz<span>SLAT7</span></div>
      <div class="logo-sub">مسابقات في الوقت الحقيقي</div>
    </div>

    <div class="card">
      <div class="card-title">اسمك</div>
      <input type="text" id="home-name" placeholder="اكتب اسمك هنا..." maxlength="20">
    </div>

    <div class="card">
      <div class="card-title">الموضوع</div>
      <div class="cat-grid">
        <button class="cat-btn cat-soccer sel" onclick="pickCat(this,'soccer')">
          <span class="cat-emoji">⚽</span>كرة القدم
        </button>
        <button class="cat-btn cat-film" onclick="pickCat(this,'film')">
          <span class="cat-emoji">🎬</span>الأفلام
        </button>
        <button class="cat-btn cat-game" onclick="pickCat(this,'game')">
          <span class="cat-emoji">🎮</span>الألعاب
        </button>
        <button class="cat-btn cat-islam" onclick="pickCat(this,'islam')">
          <span class="cat-emoji">☪️</span>إسلاميات
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">وضع اللعب</div>
      <div class="mode-grid">
        <button class="mode-btn sel" id="mode-1v1" onclick="pickMode('1v1')">
          <div class="mode-label">1 ضد 1</div>
          <div class="mode-sub">منافسة مباشرة</div>
        </button>
        <button class="mode-btn" id="mode-2v2" onclick="pickMode('2v2')">
          <div class="mode-label">2 ضد 2</div>
          <div class="mode-sub">نقاط مجمعة</div>
        </button>
      </div>
    </div>

    <button class="btn btn-primary" onclick="createRoom()">إنشاء غرفة جديدة</button>

    <div class="divider">أو</div>

    <button class="btn btn-secondary" onclick="showScreen('join')">الدخول بكود</button>
  </div>

  <!-- ════════ JOIN ════════ -->
  <div class="screen" id="screen-join">
    <div class="logo">
      <div class="logo-title">Quiz<span>Arena</span></div>
    </div>
    <div class="card">
      <div class="card-title">اسمك</div>
      <input type="text" id="join-name" placeholder="اكتب اسمك..." maxlength="20">
    </div>
    <div class="card">
      <div class="card-title">كود الغرفة</div>
      <input type="text" id="join-input" placeholder="QZ7K2M" maxlength="6">
    </div>
    <button class="btn btn-primary" onclick="joinRoom()">دخول الغرفة</button>
    <button class="btn btn-secondary" onclick="showScreen('home')">رجوع</button>
  </div>

  <!-- ════════ LOBBY ════════ -->
  <div class="screen" id="screen-lobby">
    <div class="code-box">
      <div class="code-label">كود الغرفة — شاركه مع أصحابك</div>
      <div class="code-value" id="lobby-code">——</div>
    </div>
    <div class="card">
      <div class="card-title">اللاعبون <span id="player-count" style="color:var(--purple-light)">0/4</span></div>
      <div id="players-list"></div>
      <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:6px" id="lobby-wait">في انتظار لاعبين...</div>
    </div>
    <div class="card" id="lobby-settings" style="font-size:13px;color:var(--muted)">
      الموضوع: <span id="lobby-cat" style="color:var(--text);font-weight:700"></span> &nbsp;|&nbsp;
      الوضع: <span id="lobby-mode" style="color:var(--text);font-weight:700"></span>
    </div>
    <button class="btn btn-primary" id="start-btn" onclick="startGame()" disabled>بدء المباراة</button>
    <button class="btn btn-secondary" onclick="leaveRoom()">مغادرة</button>
  </div>

  <!-- ════════ COUNTDOWN ════════ -->
  <div class="screen" id="screen-countdown">
    <div class="countdown-wrap">
      <div class="countdown-label">المباراة تبدأ في...</div>
      <div class="countdown-num" id="cd-num">3</div>
      <div class="countdown-label" id="cd-cat" style="color:var(--purple-light)"></div>
    </div>
  </div>

  <!-- ════════ QUESTION ════════ -->
  <div class="screen" id="screen-question">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;color:var(--muted)" id="q-label">سؤال 1/5</span>
      <span style="font-size:16px;font-weight:800;color:var(--teal)" id="time-display">15</span>
    </div>
    <div class="timer-wrap"><div class="timer-fill" id="timer-fill"></div></div>

    <div class="card" style="padding:16px">
      <div class="q-text" id="q-text"></div>
    </div>

    <div class="answers-grid" id="answers-grid"></div>

    <div class="pu-row">
      <button class="pu-btn active" id="pu-5050" onclick="use5050()">50/50</button>
      <button class="pu-btn" id="pu-freeze" onclick="useFreeze()">+5 ثواني</button>
      <button class="pu-btn" id="pu-x2" onclick="useX2()">×2</button>
    </div>

    <div class="card" style="padding:14px">
      <div class="card-title">النقاط المباشرة</div>
      <div class="live-scores" id="live-scores"></div>
    </div>
  </div>

  <!-- ════════ ANSWER REVEAL ════════ -->
  <div class="screen" id="screen-answer">
    <div class="result-msg" id="ans-result-msg"></div>
    <div class="card" style="padding:14px">
      <div class="q-text" style="font-size:15px;min-height:auto;padding:0;margin-bottom:12px" id="ans-q-text"></div>
      <div class="answers-grid" id="ans-choices"></div>
    </div>
    <div class="fact-box" id="ans-fact"></div>
    <div class="card" style="padding:14px">
      <div class="card-title">النقاط</div>
      <div class="live-scores" id="ans-scores"></div>
    </div>
    <button class="btn btn-primary" id="next-btn" onclick="nextQ()">السؤال التالي</button>
  </div>

  <!-- ════════ RESULTS ════════ -->
  <div class="screen" id="screen-results">
    <div class="logo" style="padding-bottom:0">
      <div class="logo-title" style="font-size:26px">النتائج النهائية</div>
    </div>
    <div class="card">
      <div class="podium" id="podium"></div>
    </div>
    <div class="card">
      <div class="card-title">الترتيب</div>
      <div class="live-scores" id="final-scores"></div>
    </div>
    <div class="row">
      <button class="btn btn-secondary" onclick="playAgain()">إعادة في نفس الغرفة</button>
      <button class="btn btn-secondary" onclick="goHome()">الخروج</button>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════
//   QUESTIONS DATABASE
// ══════════════════════════════════════
const QUESTIONS = {
  soccer: [

const CAT_NAMES = { soccer:'كرة القدم', film:'الأفلام', game:'الألعاب', islam:'إسلاميات' };
const AV_COLORS = ['av-1','av-2','av-3','av-4'];

// ══════════════════════════════════════
//   GAME STATE
// ══════════════════════════════════════
let state = {
  name: '',
  roomCode: '',
  playerKey: '',  // player1..4
  isHost: false,
  cat: 'soccer',
  mode: '1v1',
  players: {},
  qIdx: 0,
  streak: 0,
  myPts: 0,
  timer: null,
  timeLeft: 15,
  currentQ: null,
  answered: false,
  puUsed: { f50: false, freeze: false, x2: false },
  x2Active: false,
  roomListener: null,
};

// ══════════════════════════════════════
//   SCREEN MANAGEMENT
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ══════════════════════════════════════
//   HOME CONTROLS
// ══════════════════════════════════════
function pickCat(el, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
  state.cat = cat;
}

function pickMode(mode) {
  state.mode = mode;
  document.getElementById('mode-1v1').classList.toggle('sel', mode === '1v1');
  document.getElementById('mode-2v2').classList.toggle('sel', mode === '2v2');
}

// ══════════════════════════════════════
//   CREATE ROOM
// ══════════════════════════════════════
async function createRoom() {
  const name = document.getElementById('home-name').value.trim();
  if (!name) { alert('اكتب اسمك أولاً'); return; }
  if (!window.firebaseReady) { alert('Firebase غير محضّر — ضع config الخاص بك'); return; }

  state.name = name;
  state.playerKey = 'player1';
  state.isHost = true;
  state.roomCode = Math.random().toString(36).substr(2, 6).toUpperCase();
  state.myPts = 0;

  await dbSet(dbRef(db, `rooms/${state.roomCode}`), {
    host: state.playerKey,
    cat: state.cat,
    mode: state.mode,
    status: 'waiting',
    qIdx: 0,
    players: {
      player1: { name: state.name, pts: 0, team: 'A' }
    }
  });

  listenRoom();
  updateLobbyUI();
  showScreen('lobby');
}

// ══════════════════════════════════════
//   JOIN ROOM
// ══════════════════════════════════════
function showJoin() { showScreen('join'); }

async function joinRoom() {
  const name = document.getElementById('join-name').value.trim();
  const code = document.getElementById('join-input').value.trim().toUpperCase();
  if (!name) { alert('اكتب اسمك'); return; }
  if (code.length < 4) { alert('اكتب كود الغرفة'); return; }
  if (!window.firebaseReady) { alert('Firebase غير محضّر'); return; }

  const snap = await dbGet(dbRef(db, `rooms/${code}`));
  if (!snap.exists()) { alert('الغرفة غير موجودة'); return; }

  const room = snap.val();
  if (room.status !== 'waiting') { alert('اللعبة بدأت'); return; }

  const playerCount = Object.keys(room.players || {}).length;
  if (playerCount >= 4) { alert('الغرفة ممتلئة'); return; }

  state.name = name;
  state.roomCode = code;
  state.isHost = false;
  state.cat = room.cat;
  state.mode = room.mode;
  state.myPts = 0;

  const keys = ['player1','player2','player3','player4'];
  const used = Object.keys(room.players || {});
  state.playerKey = keys.find(k => !used.includes(k));

  const team = state.playerKey === 'player1' || state.playerKey === 'player3' ? 'A' : 'B';
  await dbUpdate(dbRef(db, `rooms/${code}/players/${state.playerKey}`), {
    name: state.name, pts: 0, team
  });

  listenRoom();
  updateLobbyUI();
  showScreen('lobby');
}

function updateLobbyUI() {
  document.getElementById('lobby-code').textContent = state.roomCode;
  document.getElementById('lobby-cat').textContent = CAT_NAMES[state.cat] || state.cat;
  document.getElementById('lobby-mode').textContent = state.mode;
}

// ══════════════════════════════════════
//   LISTEN TO ROOM (real-time)
// ══════════════════════════════════════
function listenRoom() {
  if (state.roomListener) {
    dbOff(dbRef(db, `rooms/${state.roomCode}`));
  }
  state.roomListener = dbOnValue(dbRef(db, `rooms/${state.roomCode}`), (snap) => {
    if (!snap.exists()) return;
    const room = snap.val();
    state.players = room.players || {};

    const screen = document.querySelector('.screen.active')?.id;

    if (room.status === 'waiting') {
      renderLobbyPlayers(room);
    } else if (room.status === 'countdown') {
      if (screen !== 'screen-countdown') startCountdownUI(room);
    } else if (room.status === 'playing') {
      state.qIdx = room.qIdx || 0;
      state.cat = room.cat;
      if (screen !== 'screen-question') showQ();
    } else if (room.status === 'next_q') {
      state.qIdx = room.qIdx || 0;
      showQ();
    } else if (room.status === 'done') {
      showResults();
    }

    // live scores update
    renderLiveScores('live-scores');
    renderLiveScores('ans-scores');
  });
}

// ══════════════════════════════════════
//   LOBBY
// ══════════════════════════════════════
function renderLobbyPlayers(room) {
  const players = room.players || {};
  const list = document.getElementById('players-list');
  const keys = Object.keys(players);
  list.innerHTML = keys.map((k, i) => {
    const p = players[k];
    const isHost = k === room.host;
    return `<div class="player-item">
      <div class="player-av ${AV_COLORS[i]}">${p.name.slice(0,2)}</div>
      <span class="player-name">${p.name}</span>
      ${isHost ? '<span class="host-tag">هوست</span>' : '<div class="wait-dot"></div>'}
    </div>`;
  }).join('');

  document.getElementById('player-count').textContent = `${keys.length}/4`;
  document.getElementById('lobby-wait').textContent =
    keys.length >= 2 ? 'جاهزون للعب!' : 'في انتظار لاعب آخر على الأقل...';

  const startBtn = document.getElementById('start-btn');
  startBtn.disabled = !(state.isHost && keys.length >= 2);
}

async function startGame() {
  await dbUpdate(dbRef(db, `rooms/${state.roomCode}`), {
    status: 'countdown',
    qIdx: 0
  });
}

async function leaveRoom() {
  await dbUpdate(dbRef(db, `rooms/${state.roomCode}/players`), {
    [state.playerKey]: null
  });
  showScreen('home');
}

// ══════════════════════════════════════
//   COUNTDOWN
// ══════════════════════════════════════
function startCountdownUI(room) {
  showScreen('countdown');
  document.getElementById('cd-cat').textContent = (CAT_NAMES[room.cat] || room.cat) + ' — ' + room.mode;
  const el = document.getElementById('cd-num');
  let c = 3;
  el.textContent = c;
  const iv = setInterval(() => {
    c--;
    if (c > 0) {
      el.textContent = c;
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = 'pop .4s ease';
    } else {
      clearInterval(iv);
      if (state.isHost) {
        dbUpdate(dbRef(db, `rooms/${state.roomCode}`), { status: 'playing', qIdx: 0 });
      }
    }
  }, 1000);
}

// ══════════════════════════════════════
//   QUESTION
// ══════════════════════════════════════
function showQ() {
  clearInterval(state.timer);
  state.answered = false;
  state.x2Active = false;
  state.puUsed = { f50: false, freeze: false, x2: false };

  const qs = QUESTIONS[state.cat];
  if (!qs || state.qIdx >= qs.length) {
    if (state.isHost) dbUpdate(dbRef(db, `rooms/${state.roomCode}`), { status: 'done' });
    return;
  }

  state.currentQ = qs[state.qIdx];
  document.getElementById('q-label').textContent = `سؤال ${state.qIdx + 1}/${qs.length}`;
  document.getElementById('q-text').textContent = state.currentQ.q;
  renderAnswers(state.currentQ.ans, -1);
  resetPUs();
  showScreen('question');
  startTimer();
}

function renderAnswers(ans, chosen) {
  const grid = document.getElementById('answers-grid');
  grid.innerHTML = ans.map((a, i) => {
    let cls = 'ans-btn';
    if (chosen !== -1) {
      if (i === state.currentQ.c) cls += ' reveal';
      else if (i === chosen) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="chooseAns(${i})" ${chosen !== -1 ? 'disabled' : ''}>${a}</button>`;
  }).join('');
}

// ══════════════════════════════════════
//   TIMER
// ══════════════════════════════════════
function startTimer() {
  state.timeLeft = 15;
  const fill = document.getElementById('timer-fill');
  const disp = document.getElementById('time-display');
  fill.style.width = '100%';
  fill.className = 'timer-fill';

  state.timer = setInterval(() => {
    state.timeLeft--;
    const pct = Math.round(state.timeLeft / 15 * 100);
    fill.style.width = pct + '%';
    disp.textContent = state.timeLeft;
    if (state.timeLeft <= 5) { fill.className = 'timer-fill urgent'; disp.style.color = 'var(--red)'; }
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      if (!state.answered) autoReveal();
    }
  }, 1000);
}

// ══════════════════════════════════════
//   ANSWER
// ══════════════════════════════════════
async function chooseAns(i) {
  if (state.answered) return;
  clearInterval(state.timer);
  state.answered = true;

  const correct = i === state.currentQ.c;
  let pts = 0;
  if (correct) {
    const spd = state.timeLeft;
    pts = spd >= 10 ? 1000 : spd >= 5 ? 700 : 400;
    if (state.x2Active) pts *= 2;
    pts += state.streak * 100;
    state.streak++;
    state.myPts += pts;
    if (state.streak >= 3) showStreakToast();
  } else {
    state.streak = 0;
  }

  renderAnswers(state.currentQ.ans, i);

  await dbUpdate(dbRef(db, `rooms/${state.roomCode}/players/${state.playerKey}`), {
    pts: state.myPts,
    answered: true
  });

  setTimeout(() => showAnswerReveal(correct, i, pts), 1000);
}

function autoReveal() {
  state.answered = true;
  state.streak = 0;
  renderAnswers(state.currentQ.ans, state.currentQ.c);
  setTimeout(() => showAnswerReveal(false, -1, 0), 800);
}

function showAnswerReveal(correct, chosen, pts) {
  const msg = document.getElementById('ans-result-msg');
  msg.textContent = correct ? `صحيح! +${pts} نقطة` : 'خطأ — الجواب الصحيح:';
  msg.className = 'result-msg ' + (correct ? 'ok' : 'fail');

  document.getElementById('ans-q-text').textContent = state.currentQ.q;
  document.getElementById('ans-fact').textContent = '💡 ' + state.currentQ.fact;

  const choices = document.getElementById('ans-choices');
  choices.innerHTML = state.currentQ.ans.map((a, i) =>
    `<div class="ans-btn ${i === state.currentQ.c ? 'correct' : ''}" style="cursor:default">${a}</div>`
  ).join('');

  const qs = QUESTIONS[state.cat];
  const isLast = state.qIdx >= qs.length - 1;
  document.getElementById('next-btn').textContent = isLast ? 'النتائج النهائية' : 'السؤال التالي';
  document.getElementById('next-btn').style.display = state.isHost ? 'block' : 'none';

  if (!state.isHost) {
    document.getElementById('next-btn').style.display = 'none';
    const info = document.createElement('div');
    info.style.cssText = 'text-align:center;font-size:12px;color:var(--muted);padding:4px';
    info.textContent = 'في انتظار الهوست...';
    document.getElementById('next-btn').replaceWith(info);
  }

  showScreen('answer');
}

async function nextQ() {
  const qs = QUESTIONS[state.cat];
  const next = state.qIdx + 1;
  if (next >= qs.length) {
    await dbUpdate(dbRef(db, `rooms/${state.roomCode}`), { status: 'done' });
  } else {
    await dbUpdate(dbRef(db, `rooms/${state.roomCode}`), {
      status: 'next_q',
      qIdx: next,
    });
    setTimeout(() => {
      dbUpdate(dbRef(db, `rooms/${state.roomCode}`), { status: 'playing' });
    }, 100);
  }
}

// ══════════════════════════════════════
//   POWER-UPS
// ══════════════════════════════════════
function resetPUs() {
  ['5050','freeze','x2'].forEach(id => {
    const btn = document.getElementById('pu-' + id);
    btn.className = 'pu-btn' + (id === '5050' ? ' active' : '');
    btn.disabled = false;
  });
}

function use5050() {
  if (state.puUsed.f50 || state.answered) return;
  state.puUsed.f50 = true;
  document.getElementById('pu-5050').classList.add('used');
  const btns = document.querySelectorAll('#answers-grid .ans-btn');
  let removed = 0;
  btns.forEach((b, i) => {
    if (i !== state.currentQ.c && removed < 2) {
      b.style.opacity = '.2'; b.disabled = true; removed++;
    }
  });
}

function useFreeze() {
  if (state.puUsed.freeze || state.answered) return;
  state.puUsed.freeze = true;
  state.timeLeft = Math.min(state.timeLeft + 5, 15);
  document.getElementById('pu-freeze').classList.add('used');
}

function useX2() {
  if (state.puUsed.x2 || state.answered) return;
  state.puUsed.x2 = true;
  state.x2Active = true;
  document.getElementById('pu-x2').className = 'pu-btn active used';
}

// ══════════════════════════════════════
//   STREAK TOAST
// ══════════════════════════════════════
function showStreakToast() {
  const t = document.getElementById('streak-toast');
  t.textContent = `سلسلة ×${state.streak} — +${state.streak * 100} bonus!`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════
//   LIVE SCORES
// ══════════════════════════════════════
function renderLiveScores(targetId) {
  const el = document.getElementById(targetId);
  if (!el) return;
  const players = Object.entries(state.players || {}).sort((a, b) => b[1].pts - a[1].pts);
  el.innerHTML = players.map(([k, p], i) => `
    <div class="score-row">
      <div class="player-av ${AV_COLORS[i % 4]}" style="width:28px;height:28px;font-size:11px">${p.name.slice(0,2)}</div>
      <span class="score-name">${p.name}</span>
      <span class="score-pts ${i === 0 ? 'lead' : ''}">${(p.pts || 0).toLocaleString()}</span>
    </div>`).join('');
}

// ══════════════════════════════════════
//   RESULTS
// ══════════════════════════════════════
function showResults() {
  const players = Object.entries(state.players || {}).sort((a, b) => b[1].pts - a[1].pts);

  // Podium
  const podium = document.getElementById('podium');
  const blocks = [
    { cls: 'p2-block', label: '2', avCls: 'av-2' },
    { cls: 'p1-block', label: '1', avCls: 'av-1' },
    { cls: 'p3-block', label: '3', avCls: 'av-3' },
  ];
  const order = players.length >= 3
    ? [players[1], players[0], players[2]]
    : players.length === 2 ? [players[1], players[0]] : [players[0]];
  const bOrder = players.length >= 3 ? blocks : [blocks[1], blocks[0]];

  podium.innerHTML = order.map(([k, p], i) => `
    <div class="podium-col">
      <div class="podium-av ${bOrder[i].avCls}">${p.name.slice(0,2)}</div>
      <div class="podium-name">${p.name}</div>
      <div class="podium-block ${bOrder[i].cls}">${bOrder[i].label}</div>
    </div>`).join('');

  // Full scores
  const fs = document.getElementById('final-scores');
  fs.innerHTML = players.map(([k, p], i) => `
    <div class="score-row">
      <div class="player-av ${AV_COLORS[i % 4]}" style="width:28px;height:28px;font-size:11px">${p.name.slice(0,2)}</div>
      <span class="score-name">${p.name}</span>
      <span style="font-size:11px;color:var(--muted);margin-left:auto;margin-right:8px">#${i+1}</span>
      <span class="score-pts ${i === 0 ? 'lead' : ''}">${(p.pts || 0).toLocaleString()} نقطة</span>
    </div>`).join('');

  showScreen('results');
}

async function playAgain() {
  if (!state.isHost) { alert('فقط الهوست يقدر يعيد اللعبة'); return; }
  await dbUpdate(dbRef(db, `rooms/${state.roomCode}`), {
    status: 'waiting',
    qIdx: 0,
  });
  // reset pts
  const updates = {};
  Object.keys(state.players).forEach(k => { updates[`players/${k}/pts`] = 0; });
  await dbUpdate(dbRef(db, `rooms/${state.roomCode}`), updates);
  state.myPts = 0; state.streak = 0;
  showScreen('lobby');
}

function goHome() {
  if (state.roomListener) dbOff(dbRef(db, `rooms/${state.roomCode}`));
  showScreen('home');
}

// ══════════════════════════════════════
//   DEMO MODE (بدون Firebase)
// ══════════════════════════════════════
window.addEventListener('firebase-ready', () => { console.log('Firebase جاهز'); });

// لو Firebase مش محضّر — وضع تجريبي محلي
setTimeout(() => {
  if (!window.firebaseReady) {
    console.warn('Firebase غير محضّر — وضع تجريبي');
    window.firebaseReady = 'demo';
    window.db = null;
    window.dbRef = () => null;
    window.dbSet = async () => {};
    window.dbGet = async () => ({ exists: () => false, val: () => null });
    window.dbUpdate = async () => {};
    window.dbOnValue = () => {};
    window.dbOff = () => {};

    // Simulate demo
    window.createRoom = function() {
      const name = document.getElementById('home-name').value.trim() || 'لاعب';
      state.name = name; state.playerKey = 'player1'; state.isHost = true;
      state.roomCode = 'DEMO01'; state.myPts = 0;
      state.players = {
        player1: { name, pts: 0, team: 'A' },
        player2: { name: 'يوسف', pts: 0, team: 'B' }
      };
      document.getElementById('lobby-code').textContent = 'DEMO01';
      document.getElementById('lobby-cat').textContent = CAT_NAMES[state.cat];
      document.getElementById('lobby-mode').textContent = state.mode;
      renderLobbyPlayers({ players: state.players, host: 'player1' });
      document.getElementById('start-btn').disabled = false;
      showScreen('lobby');
    };
    window.startGame = function() {
      showScreen('countdown');
      document.getElementById('cd-cat').textContent = CAT_NAMES[state.cat] + ' — ' + state.mode;
      let c = 3;
      document.getElementById('cd-num').textContent = c;
      const iv = setInterval(() => {
        c--;
        if (c > 0) { document.getElementById('cd-num').textContent = c; }
        else { clearInterval(iv); state.qIdx = 0; showQ(); }
      }, 1000);
    };
    window.nextQ = function() {
      const qs = QUESTIONS[state.cat];
      state.qIdx++;
      if (state.qIdx >= qs.length) { showResults(); }
      else { showQ(); }
    };
    window.leaveRoom = function() { showScreen('home'); };
    window.joinRoom = function() { alert('وضع تجريبي — ضع Firebase config لتفعيل الغرف الحقيقية'); };
    window.playAgain = function() {
      state.myPts = 0; state.streak = 0; state.qIdx = 0;
      Object.keys(state.players).forEach(k => state.players[k].pts = 0);
      showScreen('lobby');
    };
    window.goHome = function() { showScreen('home'); };
  }
}, 2000);

window.showScreen = showScreen;
window.showJoin   = showJoin;
window.pickCat    = pickCat;
window.pickMode   = pickMode;
window.createRoom = createRoom;
window.joinRoom   = joinRoom;
window.startGame  = startGame;
window.leaveRoom  = leaveRoom;
window.chooseAns  = chooseAns;
window.nextQ      = nextQ;
window.use5050    = use5050;
window.useFreeze  = useFreeze;
window.useX2      = useX2;
window.playAgain  = playAgain;
window.goHome     = goHome;
</script>
</body>
